<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Асинхронные операции JavaScript</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header><h1>Асинхронные операции</h1><p>Реализуйте функции в файле async-tasks.js</p></header>
        <section id="tasks-section">
            <div class="task-area" id="task1"><h3>Задача 1: Промисы</h3>
                <button id="basic-promise">Базовый промис</button>
                <button id="promise-chain">Цепочка</button>
                <button id="promise-error">Ошибка</button>
                <div id="promise-output" class="output">Результат: </div>
            </div>
            <div class="task-area" id="task2"><h3>Задача 2: Async/Await</h3>
                <button id="basic-async">Async/await</button>
                <button id="async-error">Ошибка async</button>
                <button id="async-parallel">Параллельно</button>
                <div id="async-output" class="output">Результат async: </div>
            </div>
            <div class="task-area" id="task3"><h3>Задача 3: API</h3>
                <button id="fetch-users">Загрузить пользователей</button>
                <button id="fetch-post">Создать пост</button>
                <button id="fetch-error">Тест ошибки</button>
                <div id="api-output" class="output">API: </div>
                <div id="api-data" class="data-container"></div>
            </div>
            <div class="task-area" id="task4"><h3>Задача 4: Таймеры</h3>
                <button id="start-interval">Старт</button>
                <button id="stop-interval">Стоп</button>
                <button id="delay-promise">Задержка</button>
                <div id="interval-output" class="output">Интервал: 0</div>
                <div id="timer-output" class="output">Прогресс: </div>
            </div>
        </section>
        <footer id="main-footer"><p>Проверьте консоль</p></footer>
    </div>
    <script src="async-tasks.js"></script>
    <script src="async-tests.js"></script>
</body>
</html>
