<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header><h1>Fetch API</h1><p>Реализуйте функции в файле fetch-tasks.js</p></header>
        <section id="tasks-section">
            <div class="task-area" id="task1"><h3>Задача 1: GET</h3>
                <button id="fetch-get">Простой GET</button>
                <button id="fetch-json">JSON данные</button>
                <button id="fetch-error">Тест ошибки</button>
                <div id="get-output" class="output">GET: </div>
                <div id="get-data" class="data-container"></div>
            </div>
            <div class="task-area" id="task2"><h3>Задача 2: CRUD</h3>
                <button id="fetch-post">POST</button>
                <button id="fetch-put">PUT</button>
                <button id="fetch-patch">PATCH</button>
                <button id="fetch-delete">DELETE</button>
                <div id="crud-output" class="output">CRUD: </div>
            </div>
            <div class="task-area" id="task3"><h3>Задача 3: Заголовки и параметры</h3>
                <button id="fetch-headers">Заголовки</button>
                <button id="fetch-auth">Авторизация</button>
                <button id="fetch-params">Параметры</button>
                <button id="fetch-timeout">Таймаут</button>
                <div id="headers-output" class="output">Заголовки: </div>
            </div>
            <div class="task-area" id="task4"><h3>Задача 4: Обработка ответов</h3>
                <button id="fetch-status">Статус</button>
                <button id="fetch-headers-response">Заголовки ответа</button>
                <button id="fetch-blob">Blob</button>
                <button id="fetch-formdata">FormData</button>
                <div id="response-output" class="output">Ответы: </div>
            </div>
            <div class="task-area" id="task5"><h3>Задача 5: Ошибки</h3>
                <button id="fetch-network-error">Сеть</button>
                <button id="fetch-http-error">HTTP</button>
                <button id="fetch-abort">Отмена</button>
                <button id="fetch-retry">Retry</button>
                <div id="error-output" class="output">Ошибки: </div>
            </div>
            <div class="task-area" id="task6"><h3>Задача 6: Параллельно</h3>
                <button id="fetch-promise-all">Promise.all</button>
                <button id="fetch-promise-race">Promise.race</button>
                <button id="fetch-sequential">Последовательно</button>
                <div id="parallel-output" class="output">Параллельно: </div>
            </div>
        </section>
        <footer id="main-footer"><p>Проверьте консоль</p></footer>
    </div>
    <script src="fetch-tasks.js"></script>
    <script src="fetch-tests.js"></script>
</body>
</html>
